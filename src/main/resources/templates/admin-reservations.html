<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toutes les Réservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }
        .app-navbar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
        }
        .soft-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(15, 23, 42, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Bibliothèque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/">Accueil</a>
                <a class="nav-link" href="/livres">Livres</a>
                <a class="nav-link" href="/auteurs">Auteurs</a>
                <a class="nav-link active" href="/admin/reservations">Gestion Réservations</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="card soft-card">
        <div class="card-body p-4 p-lg-5">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
                <div>
                    <span class="badge text-bg-dark mb-2">Administration</span>
                    <h1 class="h3 fw-bold mb-1">Gestion des Réservations</h1>
                    <p class="text-secondary mb-0">Visualisez l'ensemble des réservations en cours.</p>
                </div>
                <a href="/livres" class="btn btn-outline-primary">Retour aux livres</a>
            </div>

            <div th:if="${reservations.isEmpty()}" class="alert alert-secondary mb-0">
                <strong>Aucune réservation pour le moment.</strong>
            </div>

            <div th:if="${!reservations.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Utilisateur</th>
                        <th>Livre</th>
                        <th>Auteur</th>
                        <th>Date Réservation</th>
                        <th>Statut</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reservation : ${reservations}">
                        <td th:text="${reservation.id}"></td>
                        <td class="fw-semibold" th:text="${reservation.user.username}"></td>
                        <td th:text="${reservation.livre.titre}"></td>
                        <td th:text="${reservation.livre.auteur != null ? reservation.livre.auteur.nom + ' ' + reservation.livre.auteur.prenom : 'Aucun'}"></td>
                        <td th:text="${#temporals.format(reservation.dateReservation, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge rounded-pill text-bg-info">Réservé</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
