<!DOCTYPE html>
<html lang="fr" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Liste des auteurs</title>
</head>
<body>

<h1>Liste des auteurs</h1>

<div th:if="${success}" style="color: green;">
    <p th:text="${success}"></p>
</div>
<div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
</div>

<a href="/">Accueil</a> | <a href="/livres">Voir les livres</a>
<a href="/auteurs/ajouter" sec:authorize="hasRole('ADMIN')">Ajouter Auteur</a>
<form th:action="@{/logout}" method="post" style="display: inline;">
    <button type="submit">Déconnexion</button>
</form>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>

    <tr th:each="auteur : ${auteurs}">
        <td th:text="${auteur.id}"></td>
        <td th:text="${auteur.nom}"></td>
        <td th:text="${auteur.prenom}"></td>
        <td sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/auteurs/edit/{id}(id=${auteur.id})}">Modifier</a> |
            <a th:href="@{/auteurs/delete/{id}(id=${auteur.id})}">Supprimer</a>
        </td>
    </tr>
</table>

</body>
</html>
