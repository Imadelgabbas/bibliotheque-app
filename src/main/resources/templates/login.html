<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }
        .app-navbar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .auth-shell {
            min-height: calc(100vh - 72px);
        }
        .soft-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Bibliothèque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="authNavbar">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/login">Connexion</a>
                <a class="nav-link" href="/register">Inscription</a>
            </div>
        </div>
    </div>
</nav>

<main class="container auth-shell d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card soft-card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge text-bg-primary mb-3">Espace sécurisé</span>
                    <h1 class="h3 fw-bold mb-2">Connexion</h1>
                    <p class="text-secondary mb-0">Accédez à votre bibliothèque avec votre email et mot de passe.</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger">
                    Email ou mot de passe invalide.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    Vous avez été déconnecté.
                </div>

                <form th:action="@{/login}" method="post" class="d-grid gap-3">
                    <div>
                        <label for="username" class="form-label fw-semibold">Email</label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg" required autofocus>
                    </div>

                    <div>
                        <label for="password" class="form-label fw-semibold">Mot de passe</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg">Se connecter</button>
                </form>

                <p class="text-center text-secondary mt-4 mb-0">
                    Pas encore de compte ?
                    <a th:href="@{/register}" class="link-primary fw-semibold text-decoration-none">Créer un compte</a>
                </p>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
