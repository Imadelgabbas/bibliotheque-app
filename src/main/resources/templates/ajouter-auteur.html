<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter Auteur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }
        .app-navbar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
        }
        .soft-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(15, 23, 42, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Bibliothèque</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/">Accueil</a>
                <a class="nav-link" href="/livres">Livres</a>
                <a class="nav-link active" href="/auteurs">Auteurs</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card soft-card">
                <div class="card-body p-4 p-lg-5">
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                        <div>
                            <span class="badge text-bg-primary mb-2">Référentiel</span>
                            <h1 class="h3 fw-bold mb-1">Ajouter un auteur</h1>
                            <p class="text-secondary mb-0">Ajoutez un nouvel auteur à votre catalogue.</p>
                        </div>
                        <a href="/auteurs" class="btn btn-outline-secondary">Retour</a>
                    </div>

                    <form action="/auteurs/save" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>

                        <div class="col-12 d-flex flex-column flex-sm-row gap-2 pt-2">
                            <button type="submit" class="btn btn-primary">Ajouter</button>
                            <a href="/auteurs" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
